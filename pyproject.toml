[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenguard"
version = "0.1.0"
description = "A token-aware, Redis-backed rate limiter for Django (work in progress)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/tokenguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]