[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenguard"
version = "0.4.0"
description = "A token-aware, Redis-backed rate limiter for Django, built for LLM APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["redis>=5.0"]

[project.optional-dependencies]
django = ["django>=4.2"]
drf = ["django>=4.2", "djangorestframework>=3.14"]
dashboard = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "channels>=4.0",
    "channels-redis>=4.1",
    "daphne>=4.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-django",
    "ruff",
    "django>=4.2",
    "djangorestframework>=3.14",
    "channels>=4.0",
    "channels-redis>=4.1",
    "daphne>=4.0",
    "pytest-asyncio",
    "websockets",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tokenguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["demo"]
DJANGO_SETTINGS_MODULE = "demo_site.settings"

[tool.ruff]
line-length = 88
src = ["src", "tests", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
