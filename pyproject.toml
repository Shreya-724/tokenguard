[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The install name differs from the import name: `pip install tokenguard-ratelimit`,
# then `import tokenguard`. (The name "tokenguard" is taken on PyPI.)
name = "tokenguard-ratelimit"
version = "1.0.1"
description = "A token-aware, Redis-backed rate limiter for Django, built for LLM APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Udesna Bhattarai" }]
keywords = [
    "rate-limiting",
    "rate-limiter",
    "token-bucket",
    "redis",
    "lua",
    "django",
    "llm",
    "openai",
    "throttling",
    "api",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["redis>=5.0"]

[project.urls]
Homepage = "https://shreya-724.github.io/tokenguard/"
Source = "https://github.com/Shreya-724/tokenguard"
Issues = "https://github.com/Shreya-724/tokenguard/issues"
Changelog = "https://github.com/Shreya-724/tokenguard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
django = ["django>=4.2"]
drf = ["django>=4.2", "djangorestframework>=3.14"]
dashboard = [
    # redis 8 made socket_timeout default to 5 s, which equals channels-redis's
    # blocking wait and drops idle WebSockets every ~5 s (django/channels_redis#422).
    # Remove the cap once a channels-redis release fixes it.
    "redis>=5.0,<8",
    "django>=4.2",
    "djangorestframework>=3.14",
    "channels>=4.0",
    "channels-redis>=4.1",
    "daphne>=4.0",
]
bench = ["locust>=2.20", "daphne>=4.0", "djangorestframework>=3.14", "django>=4.2"]
dev = [
    "redis>=5.0,<8",  # see the note under `dashboard`
    "tomli; python_version < '3.11'",  # scripts/release_check.py reads pyproject.toml
    "pytest",
    "pytest-cov",
    "pytest-django",
    "ruff",
    "django>=4.2",
    "djangorestframework>=3.14",
    "channels>=4.0",
    "channels-redis>=4.1",
    "daphne>=4.0",
    "pytest-asyncio",
    "websockets",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tokenguard"]  # includes the .lua scripts and py.typed

[tool.hatch.build.targets.sdist]
# Enough to run the tests from the sdist; not the React app or benchmark results.
include = [
    "/src",
    "/tests",
    "/demo",
    "/docs",
    "/scripts",
    "/benchmarks",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
exclude = ["/benchmarks/results", "**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["demo"]
DJANGO_SETTINGS_MODULE = "demo_site.settings"

[tool.ruff]
line-length = 88
src = ["src", "tests", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
