name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=tokenguard --cov-report=term-missing
      - name: Django system check
        run: python demo/manage.py check
      - name: End-to-end HTTP test (real server, real Redis)
        run: |
          python demo/manage.py runserver 8000 --noreload > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health/ && break; sleep 1; done
          python scripts/e2e_http.py http://localhost:8000
      - name: Show server log on failure
        if: failure()
        run: cat server.log
